name: update-radar
on:
  schedule:
    - cron: "40 21 * * 1-5"   # weekdays 21:40 UTC, after the US close
    - cron: "40 12 * * 1-5"   # weekdays 12:40 UTC, before the US open (earnings dates, pre-market)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "config.json", "tests/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Fetch data and rebuild dashboard
        run: python -m airadar.build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          git diff --cached --quiet || git commit -m "Update radar data"
          git pull --rebase --autostash || true
          git push
